<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${pageTitle})}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: sidebar}"></aside>

    <main class="main">
        <header class="page-head">
            <div>
                <h1 th:text="${pageTitle}">All tasks</h1>
                <p class="sub" th:if="${pageSubtitle != null and !pageSubtitle.isEmpty()}" th:text="${pageSubtitle}">Everything across your lists.</p>
            </div>
            <div class="head-actions">
                <a th:if="${activeList != null}" th:href="@{/lists/{id}/edit(id=${activeList.id})}" class="btn btn-ghost">Edit list</a>
                <a th:href="@{/tasks/new(list=${activeListId})}" class="btn btn-primary">Add task</a>
            </div>
        </header>

        <section class="progress-panel" aria-label="Completion progress">
            <div class="progress-top">
                <div class="progress-figure">
                    <strong th:text="${stats.percent} + '%'">0%</strong>
                    <span th:text="${stats.done} + ' of ' + ${stats.total} + ' tasks done'">0 of 0 tasks done</span>
                </div>
                <ul class="mini-stats">
                    <li><b th:text="${stats.open}">0</b> open</li>
                    <li><b th:text="${stats.dueToday}">0</b> due today</li>
                    <li th:classappend="${stats.overdue > 0} ? 'warn'"><b th:text="${stats.overdue}">0</b> overdue</li>
                </ul>
            </div>
            <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                 th:attr="aria-valuenow=${stats.percent}">
                <span th:style="'width:' + ${stats.percent} + '%'"></span>
            </div>
        </section>

        <form class="filters" method="get" th:action="@{/}">
            <input type="hidden" name="list" th:if="${activeListId != null}" th:value="${activeListId}">
            <input type="search" name="q" placeholder="Search tasks" aria-label="Search tasks" th:value="${q}">
            <select name="view" aria-label="Show" data-autosubmit>
                <option value="all" th:selected="${view == 'all'}">Show all</option>
                <option value="open" th:selected="${view == 'open'}">Open</option>
                <option value="today" th:selected="${view == 'today'}">Due today</option>
                <option value="upcoming" th:selected="${view == 'upcoming'}">Upcoming</option>
                <option value="overdue" th:selected="${view == 'overdue'}">Overdue</option>
                <option value="completed" th:selected="${view == 'completed'}">Completed</option>
            </select>
            <select name="priority" aria-label="Priority" data-autosubmit>
                <option value="">Any priority</option>
                <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.label}" th:selected="${p == priority}">High</option>
            </select>
            <button type="submit" class="btn btn-ghost">Search</button>
            <a th:if="${filtersActive}" class="clear" th:href="${activeListId != null} ? @{/(list=${activeListId})} : @{/}">Clear filters</a>
        </form>

        <ul class="task-list" th:if="${!tasks.isEmpty()}">
            <li th:each="t : ${tasks}" class="task"
                th:classappend="'priority-' + ${t.priority.css} + (${t.completed} ? ' is-done' : '')">

                <form th:action="@{/tasks/{id}/toggle(id=${t.id})}" method="post" class="toggle">
                    <input type="hidden" name="returnTo" th:value="${returnTo}">
                    <button type="submit" class="check"
                            th:attr="aria-label=${t.completed} ? 'Mark as not done' : 'Mark as done'"
                            th:title="${t.completed} ? 'Mark as not done' : 'Mark as done'"></button>
                </form>

                <div class="task-main">
                    <a class="task-title" th:href="@{/tasks/{id}/edit(id=${t.id})}" th:text="${t.title}">Task title</a>
                    <p class="task-desc" th:if="${t.description != null}" th:text="${t.description}">Notes</p>
                    <div class="task-meta">
                        <span class="chip" th:if="${activeListId == null}">
                            <i class="dot" th:style="'background:' + ${t.taskList.color}"></i>
                            <span th:text="${t.taskList.name}">List</span>
                        </span>
                        <span class="due" th:classappend="${t.overdue} ? 'overdue' : (${t.dueToday} ? 'today')" th:text="${t.dueLabel}">Today</span>
                        <span class="pill" th:classappend="${t.priority.css}" th:text="${t.priority.label}">High</span>
                    </div>
                </div>

                <div class="task-actions">
                    <a class="link-btn" th:href="@{/tasks/{id}/edit(id=${t.id})}">Edit</a>
                    <form th:action="@{/tasks/{id}/delete(id=${t.id})}" method="post"
                          data-confirm="Delete this task? This can't be undone.">
                        <input type="hidden" name="returnTo" th:value="${returnTo}">
                        <button type="submit" class="link-btn danger">Delete</button>
                    </form>
                </div>
            </li>
        </ul>

        <section class="empty" th:if="${tasks.isEmpty()}">
            <h2 th:text="${filtersActive} ? 'No tasks match these filters' : 'Nothing here yet'">Nothing here yet</h2>
            <p th:text="${filtersActive} ? 'Clear the filters or try a different search.' : 'Add a task to start tracking your work.'">Add a task to start tracking your work.</p>
            <a class="btn btn-primary" th:href="@{/tasks/new(list=${activeListId})}">Add task</a>
        </section>
    </main>
</div>
</body>
</html>
